name: aiya-cms

# Default application compose: management-plane FastAPI and administrator SPA.
# The unfinished Astro user site is available only through the explicit site profile.
# PostgreSQL and Redis live in compose.infra.yaml (or an external panel);
# application services only connect through explicit environment settings.
#
# One-shot maintenance and quality gates are internalized in inc.cli and run
# through this same image, e.g.:
#   docker compose run --rm backend python -m inc.cli migrate
#   docker compose run --rm backend python -m inc.cli install --profile admin
#   docker compose run --rm backend python -m inc.cli quality
#   docker compose run --rm backend python -m inc.cli test
#   docker compose run --rm backend python -m inc.cli openapi-check
#   docker compose run --rm backend python -m inc.cli migration-check

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    env_file: [.env]
    environment:
      AIYA_APP_PROFILE: ${AIYA_APP_PROFILE:-management}
      AIYA_DATABASE_URL: ${AIYA_DATABASE_URL:?AIYA_DATABASE_URL is required}
      AIYA_REDIS_URL: ${AIYA_REDIS_URL:?AIYA_REDIS_URL is required}
      AIYA_PG_DATABASE: ${AIYA_PG_DATABASE:-aiya}
      AIYA_OIDC_SIGNING_KEY_DIR: /var/lib/aiya/oidc-keys
    command: ["uvicorn", "inc.main:get_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_HOST_PORT:-8000}:8000"
    volumes:
      - oidc-key-data:/var/lib/aiya/oidc-keys
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 10

  backend-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    profiles: [dev]
    env_file: [.env]
    environment:
      AIYA_APP_PROFILE: cms_dev
      AIYA_PG_DATABASE: ${AIYA_PG_DATABASE:-aiya}
    command: ["uvicorn", "inc.main:get_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./inc:/app/inc:ro
      - ./alembic:/app/alembic:ro
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
      args:
        AIYA_ISSUER: ${AIYA_ISSUER:-http://127.0.0.1:8080}
        AIYA_PUBLIC_BASE_URL: ${AIYA_PUBLIC_BASE_URL:-http://127.0.0.1:8080}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${ADMIN_BIND_ADDRESS:-127.0.0.1}:${ADMIN_HOST_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/admin-healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  site:
    build:
      context: .
      dockerfile: site/Dockerfile
      args:
        SITE_BUILD_ENVIRONMENT: ${SITE_ENVIRONMENT:-production}
        SITE_BUILD_ORIGIN: ${SITE_ORIGIN:-https://www.example.com}
    env_file: [.env]
    profiles: [site]
    environment:
      SITE_API_ORIGIN: ${SITE_API_ORIGIN:-http://backend:8000}
      SITE_OIDC_CLIENT_SECRET: ${AIYA_SITE_OIDC_CLIENT_SECRET:-dev-aiya-site-secret-change-before-use-1234567890}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${SITE_HOST_PORT:-4321}:4321"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4321/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  oidc-key-data:
