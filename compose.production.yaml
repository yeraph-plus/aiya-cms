name: aiya-cms

# Single application image: Nginx serves the admin SPA and proxies FastAPI
# inside the same container. PostgreSQL and Redis remain external services.
services:
  app:
    image: ${AIYA_CMS_IMAGE:-aiya-cms:production}
    environment:
      - AIYA_ENVIRONMENT=${AIYA_ENVIRONMENT:-production}
      - AIYA_APP_PROFILE=release
      - AIYA_AUTO_INSTALL=${AIYA_AUTO_INSTALL:-true}
      - AIYA_ADMIN_USERNAME=${AIYA_ADMIN_USERNAME:-admin}
      - AIYA_ADMIN_EMAIL=${AIYA_ADMIN_EMAIL:-admin@example.com}
      - AIYA_ADMIN_PASSWORD=${AIYA_ADMIN_PASSWORD:-}
      - AIYA_LOG_LEVEL=${AIYA_LOG_LEVEL:-INFO}
      - AIYA_PG_HOST=${AIYA_PG_HOST:?AIYA_PG_HOST is required}
      - AIYA_PG_PORT=${AIYA_PG_PORT:-5432}
      - AIYA_PG_USER=${AIYA_PG_USER:-aiya}
      - AIYA_PG_PASSWORD=${AIYA_PG_PASSWORD:?AIYA_PG_PASSWORD is required}
      - AIYA_PG_DATABASE=${AIYA_PG_DATABASE:-aiya}
      - AIYA_DATABASE_URL=${AIYA_DATABASE_URL:?AIYA_DATABASE_URL is required}
      - AIYA_REDIS_HOST=${AIYA_REDIS_HOST:-host.docker.internal}
      - AIYA_REDIS_PORT=${AIYA_REDIS_PORT:-6379}
      - AIYA_REDIS_DB=${AIYA_REDIS_DB:-0}
      - AIYA_REDIS_PASSWORD=${AIYA_REDIS_PASSWORD:-}
      - AIYA_REDIS_URL=${AIYA_REDIS_URL:?AIYA_REDIS_URL is required}
      - AIYA_JWT_SECRET=${AIYA_JWT_SECRET:?AIYA_JWT_SECRET is required}
      - AIYA_JWT_ACCESS_TTL_SECONDS=${AIYA_JWT_ACCESS_TTL_SECONDS:-900}
      - AIYA_JWT_REFRESH_TTL_SECONDS=${AIYA_JWT_REFRESH_TTL_SECONDS:-1209600}
      - AIYA_CACHE_BACKEND=${AIYA_CACHE_BACKEND:-redis}
      - AIYA_OIDC_SIGNING_KEY_DIR=/var/lib/aiya/oidc-keys
      - AIYA_ISSUER=${AIYA_ISSUER:?AIYA_ISSUER is required}
      - AIYA_API_AUDIENCE=${AIYA_API_AUDIENCE:-aiya-admin}
      - AIYA_SECURE_COOKIES=${AIYA_SECURE_COOKIES:-true}
      - AIYA_ADMIN_SESSION_SECRET=${AIYA_ADMIN_SESSION_SECRET:?AIYA_ADMIN_SESSION_SECRET is required}
      - AIYA_ADMIN_SESSION_IDLE_SECONDS=${AIYA_ADMIN_SESSION_IDLE_SECONDS:-28800}
      - AIYA_ADMIN_SESSION_ABSOLUTE_SECONDS=${AIYA_ADMIN_SESSION_ABSOLUTE_SECONDS:-1209600}
      - AIYA_CORS_ORIGINS=${AIYA_CORS_ORIGINS:?AIYA_CORS_ORIGINS is required}
      - AIYA_TRUSTED_PROXY_CIDRS=${AIYA_TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128}
      - AIYA_PUBLIC_BASE_URL=${AIYA_PUBLIC_BASE_URL:?AIYA_PUBLIC_BASE_URL is required}
      - AIYA_SITE_BASE_URL=${AIYA_SITE_BASE_URL:?AIYA_SITE_BASE_URL is required}
      - AIYA_SITE_OIDC_CLIENT_SECRET=${AIYA_SITE_OIDC_CLIENT_SECRET:?AIYA_SITE_OIDC_CLIENT_SECRET is required}
      - AIYA_OUTBOX_BATCH_SIZE=${AIYA_OUTBOX_BATCH_SIZE:-20}
      - AIYA_OUTBOX_LEASE_SECONDS=${AIYA_OUTBOX_LEASE_SECONDS:-60}
      - AIYA_OUTBOX_RETRY_BASE_SECONDS=${AIYA_OUTBOX_RETRY_BASE_SECONDS:-1.0}
      - AIYA_TASK_BATCH_SIZE=${AIYA_TASK_BATCH_SIZE:-10}
      - AIYA_TASK_LEASE_SECONDS=${AIYA_TASK_LEASE_SECONDS:-60}
      - AIYA_WORKER_GRACE_SECONDS=${AIYA_WORKER_GRACE_SECONDS:-30.0}
      - AIYA_WORKER_SLEEP_SECONDS=${AIYA_WORKER_SLEEP_SECONDS:-1.0}
      - AIYA_WORKFLOW_LEASE_SECONDS=${AIYA_WORKFLOW_LEASE_SECONDS:-60}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_HOST_PORT:-8080}:8080"
    volumes:
      - oidc-key-data:/var/lib/aiya/oidc-keys
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10

  site:
    build:
      context: .
      dockerfile: site/Dockerfile
      args:
        SITE_BUILD_ENVIRONMENT: ${SITE_ENVIRONMENT:-production}
        SITE_BUILD_ORIGIN: ${AIYA_SITE_BASE_URL:?AIYA_SITE_BASE_URL is required}
    environment:
      SITE_API_ORIGIN: http://app:8080
      SITE_OIDC_ISSUER: ${AIYA_ISSUER:?AIYA_ISSUER is required}
      SITE_OIDC_CLIENT_ID: aiya-site
      SITE_OIDC_SCOPE: openid profile email offline_access
      SITE_OIDC_CLIENT_SECRET: ${AIYA_SITE_OIDC_CLIENT_SECRET:?AIYA_SITE_OIDC_CLIENT_SECRET is required}
      SITE_REDIS_URL: ${AIYA_REDIS_URL:?AIYA_REDIS_URL is required}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${SITE_BIND_ADDRESS:-127.0.0.1}:${SITE_HOST_PORT:-4321}:4321"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4321/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  oidc-key-data:
