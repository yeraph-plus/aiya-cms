<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>aiya-cms 管理后台</title>
    <style>
      .preloader {
        display: flex;
        height: 100vh;
        align-items: center;
        justify-content: center;
        line-height: 1.8em;
        flex-direction: column;
      }
      .preloader h1, .preloader h2{
        margin: 1rem 0 0 0;
        font-weight: bold;
        font-size: 1.44rem;
        font-family: 'Inter var',
        'ui-sans-serif',
        'system-ui',
        'sans-serif',
        'Apple Color Emoji',
        'Segoe UI Emoji',
        'Segoe UI Symbol',
        'Noto Color Emoji'
      }
      .preloader h2{
         font-size: 1.2rem;
         font-weight: normal;
         color: #444;
      }
      .preloader .description {
        color: transparent;
        height: 10px;
      }

      
    
      .loader {
        animation: rotate 1s infinite;
        height: 50px;
        width: 50px;
      }
    
      .loader:before,
      .loader:after {
        border-radius: 50%;
        content: '';
        display: block;
        height: 20px;
        width: 20px;
      }
    
      .loader:before {
        animation: ball1 1s infinite;
        background-color: #cb2025;
        box-shadow: 30px 0 0 #f8b334;
        margin-bottom: 10px;
      }
    
      .loader:after {
        animation: ball2 1s infinite;
        background-color: #00a096;
        box-shadow: 30px 0 0 #97bf0d;
      }
    
      @keyframes rotate {
        0% {
          -webkit-transform: rotate(0deg) scale(0.8);
          -moz-transform: rotate(0deg) scale(0.8);
        }
    
        50% {
          -webkit-transform: rotate(360deg) scale(1.2);
          -moz-transform: rotate(360deg) scale(1.2);
        }
    
        100% {
          -webkit-transform: rotate(720deg) scale(0.8);
          -moz-transform: rotate(720deg) scale(0.8);
        }
      }
    
      @keyframes ball1 {
        0% {
          box-shadow: 30px 0 0 #f8b334;
        }
    
        50% {
          box-shadow: 0 0 0 #f8b334;
          margin-bottom: 0;
          -webkit-transform: translate(15px, 15px);
          -moz-transform: translate(15px, 15px);
        }
    
        100% {
          box-shadow: 30px 0 0 #f8b334;
          margin-bottom: 10px;
        }
      }
    
      @keyframes ball2 {
        0% {
          box-shadow: 30px 0 0 #97bf0d;
        }
    
        50% {
          box-shadow: 0 0 0 #97bf0d;
          margin-top: -20px;
          -webkit-transform: translate(15px, 15px);
          -moz-transform: translate(15px, 15px);
        }
    
        100% {
          box-shadow: 30px 0 0 #97bf0d;
          margin-top: 0;
        }
      }
    </style>

  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
  <link rel="mask-icon" href="/favicon/safari-pinned-tab.svg" color="#00a300">
  <link rel="shortcut icon" href="/favicon/favicon.ico">

  <meta name="msapplication-TileColor" content="#00a300">
  <meta name="msapplication-config" content="/favicon/browserconfig.xml">
  <meta name="theme-color" content="#ffffff">
</head>

<body class="font-inter">
  <div id="app">
    <div class="preloader">
      <div class="loader"></div>
      <h1>aiya-cms</h1>
      <h2>管理后台加载中</h2>
    </div>
  </div>

  <script rel="preload" type="module" src="/src/main.ts"></script>
  <noscript>此网站需要启用 JavaScript 才能正常使用，请启用后继续。</noscript>
</body>

</html>
