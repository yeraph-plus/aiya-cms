name: Build production image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - '.dockerignore'
      - 'Dockerfile.production'
      - 'compose.production.yaml'
      - 'deploy/**'
      - 'admin/**'
      - 'inc/**'
      - 'alembic/**'
      - 'pyproject.toml'
      - 'openapi*.json'
      - '.github/workflows/production-image.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install admin dependencies
        working-directory: admin
        run: npm ci --no-audit --no-fund

      - name: Build Vite assets
        working-directory: admin
        env:
          AIYA_ISSUER: ${{ vars.AIYA_ISSUER || 'http://127.0.0.1:8080' }}
          AIYA_PUBLIC_BASE_URL: ${{ vars.AIYA_PUBLIC_BASE_URL || 'http://127.0.0.1:8080' }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: Validate production origin variables
        if: github.event_name != 'pull_request'
        env:
          AIYA_ISSUER: ${{ vars.AIYA_ISSUER }}
          AIYA_PUBLIC_BASE_URL: ${{ vars.AIYA_PUBLIC_BASE_URL }}
        run: |
          test -n "$AIYA_ISSUER"
          test -n "$AIYA_PUBLIC_BASE_URL"
          case "$AIYA_ISSUER" in https://*) ;; *) echo "AIYA_ISSUER must use https://"; exit 1 ;; esac
          case "$AIYA_PUBLIC_BASE_URL" in https://*) ;; *) echo "AIYA_PUBLIC_BASE_URL must use https://"; exit 1 ;; esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.production
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
