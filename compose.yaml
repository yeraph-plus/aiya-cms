name: aiya-cms

# Application compose: the single backend image build. PostgreSQL and Redis
# live in compose.infra.yaml (or an external panel); the backend only
# connects through the decomposed AIYA_PG_*/AIYA_REDIS_* env vars.
#
# One-shot maintenance and quality gates are internalized in inc.cli and run
# through this same image, e.g.:
#   docker compose run --rm backend python -m inc.cli migrate
#   docker compose run --rm backend python -m inc.cli install
#   docker compose run --rm backend python -m inc.cli quality
#   docker compose run --rm backend python -m inc.cli test
#   docker compose run --rm backend python -m inc.cli openapi-check
#   docker compose run --rm backend python -m inc.cli migration-check

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    env_file: [.env]
    environment:
      AIYA_TEST_S3_ENDPOINT: ${AIYA_TEST_S3_ENDPOINT:-http://host.docker.internal:9000}
      AIYA_TEST_S3_BUCKET: ${AIYA_TEST_S3_BUCKET:-aiya-assets}
    command: ["uvicorn", "inc.main:get_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 10

  backend-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    profiles: [dev]
    env_file: [.env]
    command: ["uvicorn", "inc.main:get_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./inc:/app/inc:ro
      - ./alembic:/app/alembic:ro
    restart: unless-stopped
